[package]
name = "shmupx-mister-link"
version = "0.1.0"
description = "MiSTer FPGA pela rede (FTP e SSH), compartilhado pelo ShmupX Client e pelo ShmupX Lite"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["time", "macros", "rt"] }
# rustls: o mesmo código roda no Android (sem OpenSSL do sistema).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
# SSH em Rust puro (criptografia ring).
russh = { version = "=0.65.1", default-features = false, features = ["ring", "flate2", "rsa"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
