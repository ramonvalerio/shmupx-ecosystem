[package]
name = "shmupx-lab"
version = "0.1.0"
description = "ShmupX Lab"
authors = ["ShmupX"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "shmupx_lab_lib"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["net", "time", "io-util", "process", "sync", "macros", "fs"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "charset", "http2", "system-proxy"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
url = "2.5"


[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
