# ShmupX Client para Linux (AppImage), no mesmo contêiner do build local
# (shmupx-client/linux/Dockerfile + build.sh). Os pacotes ficam como artefato da execução; a
# publicação no site é manual (S3), como a do instalador do Windows.
name: client-linux

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Imagem de build
        run: docker build -t shmupx-client-linux shmupx-client/linux

      - name: Cache (Rust e motor de validação)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cache
          key: client-linux-${{ hashFiles('Cargo.lock', 'shmupx-lab/validators/requirements-build.txt') }}
          restore-keys: client-linux-

      - name: Versões mais novas do FFmpeg e do x264 (repositórios oficiais)
        id: versao
        run: |
          set -euo pipefail
          ffmpeg=$(git ls-remote --tags --refs https://git.ffmpeg.org/ffmpeg.git 'n*' | awk -F/ '{print $3}' | grep -E '^n[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -n 1)
          x264=$(git ls-remote https://code.videolan.org/videolan/x264.git refs/heads/stable | cut -f1)
          [ -n "$ffmpeg" ] && [ -n "$x264" ]
          receita=$(grep -m1 '^receita=' shmupx-client/scripts/build-ffmpeg.sh | cut -d= -f2)
          echo "ffmpeg=$ffmpeg" >> "$GITHUB_OUTPUT"
          echo "x264=$x264" >> "$GITHUB_OUTPUT"
          echo "receita=$receita" >> "$GITHUB_OUTPUT"
          echo "FFmpeg $ffmpeg, x264 $x264, receita $receita"

      - name: FFmpeg já compilado
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-cache
          key: ffmpeg-linux64-${{ steps.versao.outputs.receita }}-${{ steps.versao.outputs.ffmpeg }}-x264-${{ steps.versao.outputs.x264 }}

      - name: Pacotes
        env:
          SHMUPX_BACKEND_URL: https://shmupx-backend-230979440400.us-central1.run.app
          # Cliente OAuth "Desktop" do login Google (shmupx/client no OpenBao, copiado para o secret).
          VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FFMPEG_TAG: ${{ steps.versao.outputs.ffmpeg }}
          X264_REV: ${{ steps.versao.outputs.x264 }}
        run: |
          mkdir -p "$RUNNER_TEMP/cache" "$RUNNER_TEMP/out" "$RUNNER_TEMP/ffmpeg-cache"
          docker run --rm \
            -e SHMUPX_BACKEND_URL -e VITE_GOOGLE_DESKTOP_CLIENT_ID -e TAURI_SIGNING_PRIVATE_KEY -e TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            -e FFMPEG_TAG -e X264_REV -e FFMPEG_CACHE=/ffmpeg-cache \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/out:/out" -v "$RUNNER_TEMP/cache:/cache" -v "$RUNNER_TEMP/ffmpeg-cache:/ffmpeg-cache" \
            shmupx-client-linux bash /src/shmupx-client/linux/build.sh
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/cache" "$RUNNER_TEMP/out" "$RUNNER_TEMP/ffmpeg-cache"

      - uses: actions/upload-artifact@v4
        with:
          name: shmupx-client-linux
          path: ${{ runner.temp }}/out/*
          retention-days: 14
