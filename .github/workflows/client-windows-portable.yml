name: client-windows-portable

on:
  workflow_dispatch:

jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      SHMUPX_BACKEND_URL: https://shmupx-backend-230979440400.us-central1.run.app
      VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      FFMPEG_CACHE: ${{ github.workspace }}\ffmpeg-cache
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make nasm diffutils
            mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ffnvcodec-headers mingw-w64-x86_64-amf-headers mingw-w64-x86_64-libvpl

      - name: Versões mais novas do FFmpeg e do x264 (repositórios oficiais)
        id: versao
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg=$(git ls-remote --tags --refs https://git.ffmpeg.org/ffmpeg.git 'n*' | awk -F/ '{print $3}' | grep -E '^n[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -n 1)
          x264=$(git ls-remote https://code.videolan.org/videolan/x264.git refs/heads/stable | cut -f1)
          [ -n "$ffmpeg" ] && [ -n "$x264" ]
          receita=$(grep -m1 '^receita=' shmupx-client/scripts/build-ffmpeg.sh | cut -d= -f2)
          echo "ffmpeg=$ffmpeg" >> "$GITHUB_OUTPUT"
          echo "x264=$x264" >> "$GITHUB_OUTPUT"
          echo "receita=$receita" >> "$GITHUB_OUTPUT"
          echo "FFmpeg $ffmpeg, x264 $x264, receita $receita"

      - name: FFmpeg já compilado
        uses: actions/cache@v4
        with:
          path: ffmpeg-cache
          key: ffmpeg-win64-${{ steps.versao.outputs.receita }}-${{ steps.versao.outputs.ffmpeg }}-x264-${{ steps.versao.outputs.x264 }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shmupx-client/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cache (Rust)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: client-windows-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: client-windows-

      - name: Motor de validação
        run: ./shmupx-lab/validators/tools/build_validator.ps1 -Python python

      - name: Dependências da interface
        working-directory: shmupx-client
        run: npm ci --no-audit --no-fund

      - name: Pastas onde o ort-sys copia o DirectML (layout novo da pasta de build do Cargo)
        run: New-Item -ItemType Directory -Force target/release/build/examples, target/release/build/deps | Out-Null

      - name: Client (primeira compilação)
        run: cargo build --release -p shmupx-client

      - name: Pacote (motor, scripts, FFmpeg, yt-dlp, ShmupX Engine, runtime, WebView2)
        working-directory: shmupx-client
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          FFMPEG_TAG: ${{ steps.versao.outputs.ffmpeg }}
          X264_REV: ${{ steps.versao.outputs.x264 }}
        run: ./scripts/prepare-bundle.ps1 -ReusarMotor

      - name: Client (tauri build)
        working-directory: shmupx-client
        run: |
          npm run build
          if ($LASTEXITCODE) { throw "falha ao montar a interface" }
          $extra = @()
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Warning "sem TAURI_SIGNING_PRIVATE_KEY; gerando sem assinatura do updater"
            $semUpdater = Join-Path $env:RUNNER_TEMP "sem-updater.json"
            '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content $semUpdater -Encoding ascii
            $extra = @("--config", $semUpdater)
          }
          npx tauri build --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.bundle.windows.conf.json @extra
          if ($LASTEXITCODE) { throw "tauri build falhou" }

      - name: ShmupX Portable
        working-directory: shmupx-client
        run: ./scripts/make-portable.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: shmupx-portable-windows
          path: target/release/bundle/portable/ShmupX-Portable-*
          if-no-files-found: error
          retention-days: 14
