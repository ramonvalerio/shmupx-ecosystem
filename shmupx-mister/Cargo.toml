[package]
name = "shmupx-mister"
version = "0.2.0"
description = "Agente ShmupX para MiSTer FPGA: lê a RAM do jogo pelo espelho DDR3 do core"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
