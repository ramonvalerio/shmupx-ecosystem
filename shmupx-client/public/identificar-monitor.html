<!doctype html>
<!-- Número do monitor, grande e em vermelho no meio dele, por 3 segundos (ao escolher o monitor dos
     jogos). Aberta pelo Rust (emulador::identificar_monitor) numa janela transparente; página
     estática, sem o app, para aparecer na hora. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>ShmupX</title>
    <style>
      @font-face { font-family: "Share Tech"; src: url(/fonts/ShareTech-Regular.ttf) format("truetype"); font-weight: 400; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; cursor: default; }
      body { display: grid; place-items: center; font-family: "Share Tech", "Segoe UI", system-ui, sans-serif; font-synthesis: none; }
      #numero {
        font-size: 82vh;
        font-weight: 400;
        line-height: 1;
        color: #fd4851;
        -webkit-text-stroke: 1.2vh #06181b;
        paint-order: stroke fill;
        animation: aparece .15s ease-out, some .3s ease-in 2.7s forwards;
      }
      @keyframes aparece { from { opacity: 0; transform: scale(.9); } }
      @keyframes some { to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #numero { animation: none; } }
    </style>
  </head>
  <body>
    <div id="numero"></div>
    <script>
      document.getElementById("numero").textContent = new URLSearchParams(location.search).get("n") || "";
    </script>
  </body>
</html>
