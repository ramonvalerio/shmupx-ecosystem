<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
  <!-- Arte padrão do card (jogo sem imagem do Lab): cockpit/arcade nas cores da v5. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1114"/>
      <stop offset=".62" stop-color="#16202a"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".66" r=".55">
      <stop offset="0" stop-color="#57fcff" stop-opacity=".28"/>
      <stop offset=".45" stop-color="#49c9c9" stop-opacity=".08"/>
      <stop offset="1" stop-color="#49c9c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="engine" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff2f2"/>
      <stop offset=".35" stop-color="#fd4851"/>
      <stop offset="1" stop-color="#fd4851" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101010" stop-opacity="1"/>
      <stop offset="1" stop-color="#101010" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a42"/>
      <stop offset="1" stop-color="#141b20"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".28"/>
    </pattern>
    <clipPath id="floor"><rect x="0" y="470" width="1280" height="250"/></clipPath>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- estrelas -->
  <g fill="#d7e4e8">
    <circle cx="112" cy="84" r="2" opacity=".7"/><circle cx="268" cy="196" r="1.5" opacity=".5"/>
    <circle cx="402" cy="62" r="1.5" opacity=".6"/><circle cx="530" cy="148" r="2" opacity=".4"/>
    <circle cx="742" cy="72" r="1.5" opacity=".6"/><circle cx="868" cy="182" r="2" opacity=".5"/>
    <circle cx="1004" cy="96" r="1.5" opacity=".7"/><circle cx="1158" cy="210" r="2" opacity=".5"/>
    <circle cx="1210" cy="58" r="1.5" opacity=".4"/><circle cx="74" cy="300" r="1.5" opacity=".4"/>
    <circle cx="1220" cy="352" r="1.5" opacity=".4"/><circle cx="184" cy="402" r="2" opacity=".3"/>
  </g>
  <g stroke="#57fcff" stroke-linecap="round" opacity=".35">
    <line x1="330" y1="110" x2="330" y2="150" stroke-width="2"/>
    <line x1="960" y1="250" x2="960" y2="300" stroke-width="2"/>
    <line x1="1090" y1="130" x2="1090" y2="160" stroke-width="2"/>
  </g>

  <!-- piso em grade (perspectiva) -->
  <g clip-path="url(#floor)" stroke="#49c9c9" stroke-width="1.5" fill="none" opacity=".45">
    <line x1="640" y1="470" x2="-1400" y2="720"/><line x1="640" y1="470" x2="-900" y2="720"/>
    <line x1="640" y1="470" x2="-480" y2="720"/><line x1="640" y1="470" x2="-120" y2="720"/>
    <line x1="640" y1="470" x2="200" y2="720"/><line x1="640" y1="470" x2="480" y2="720"/>
    <line x1="640" y1="470" x2="640" y2="720"/><line x1="640" y1="470" x2="800" y2="720"/>
    <line x1="640" y1="470" x2="1080" y2="720"/><line x1="640" y1="470" x2="1400" y2="720"/>
    <line x1="640" y1="470" x2="1760" y2="720"/><line x1="640" y1="470" x2="2180" y2="720"/>
    <line x1="640" y1="470" x2="2680" y2="720"/>
    <line x1="0" y1="476" x2="1280" y2="476"/><line x1="0" y1="486" x2="1280" y2="486"/>
    <line x1="0" y1="500" x2="1280" y2="500"/><line x1="0" y1="520" x2="1280" y2="520"/>
    <line x1="0" y1="548" x2="1280" y2="548"/><line x1="0" y1="588" x2="1280" y2="588"/>
    <line x1="0" y1="644" x2="1280" y2="644"/><line x1="0" y1="720" x2="1280" y2="720"/>
  </g>
  <rect x="0" y="470" width="1280" height="40" fill="url(#fade)"/>
  <line x1="0" y1="470" x2="1280" y2="470" stroke="#57fcff" stroke-width="2" opacity=".55"/>

  <!-- tiros -->
  <g fill="#57fcff">
    <rect x="618" y="168" width="6" height="34" rx="3" opacity=".9"/>
    <rect x="656" y="168" width="6" height="34" rx="3" opacity=".9"/>
    <rect x="618" y="96" width="6" height="34" rx="3" opacity=".55"/>
    <rect x="656" y="96" width="6" height="34" rx="3" opacity=".55"/>
    <rect x="618" y="28" width="6" height="34" rx="3" opacity=".25"/>
    <rect x="656" y="28" width="6" height="34" rx="3" opacity=".25"/>
  </g>

  <!-- nave -->
  <g transform="translate(640 330)">
    <ellipse cx="-22" cy="98" rx="16" ry="30" fill="url(#engine)"/>
    <ellipse cx="22" cy="98" rx="16" ry="30" fill="url(#engine)"/>
    <path d="M0 -92 L22 -30 L30 10 L112 52 L116 74 L34 62 L26 84 L-26 84 L-34 62 L-116 74 L-112 52 L-30 10 L-22 -30 Z"
          fill="url(#hull)" stroke="#57fcff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0 -60 L12 -18 L0 -6 L-12 -18 Z" fill="#57fcff" opacity=".85"/>
    <path d="M30 10 L112 52 M-30 10 L-112 52" stroke="#fd4851" stroke-width="3"/>
    <path d="M-8 30 H8 M-14 46 H14" stroke="#49c9c9" stroke-width="2" opacity=".7"/>
  </g>

  <!-- molduras de canto (cyan e vermelho, como a sala) -->
  <g fill="none" stroke-width="4">
    <path d="M40 104 V40 H104" stroke="#57fcff"/>
    <path d="M1176 40 H1240 V104" stroke="#fd4851"/>
    <path d="M40 616 V680 H104" stroke="#fd4851" opacity=".6"/>
    <path d="M1176 680 H1240 V616" stroke="#57fcff" opacity=".6"/>
  </g>

  <rect width="1280" height="720" fill="url(#scan)"/>
</svg>
