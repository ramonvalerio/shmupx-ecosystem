[package]
name = "shmupx-client"
version = "0.1.22"
description = "ShmupX Client"
authors = ["ShmupX"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "shmupx_client_lib"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "sync", "macros", "io-util"] }
sysinfo = "0.33"
# Procurar opções no executável do ShmupX Engine (motor antigo não abre com opção desconhecida).
memchr = "2"
gilrs = "0.11"
cpal = "0.15"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots", "charset", "http2", "system-proxy"] }
rodio = { version = "0.19", default-features = false, features = ["mp3"] }
ort = "2.0.0-rc.13"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
# assinatura da interface publicada sem instalador (a mesma verificação do updater)
minisign-verify = "0.3"
base64 = "0.22"
getrandom = "0.2"
url = "2.5"
tauri-plugin-process = "2"
# Janela do sistema para escolher a pasta das gravações.
tauri-plugin-dialog = "=2.8.4"
# MiSTer FPGA pela rede (FTP e SSH), o mesmo código do ShmupX Lite.
shmupx-mister-link = { path = "../../shmupx-mister-link" }

# Captura da janela do jogo para a live (Windows Graphics Capture).
[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
# Área interna da janela (sem a barra de título), redução na placa de vídeo (gravação da run) e
# som só do processo do jogo.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_Security",
] }
# O `#[implement]` do `windows` gera código que usa este crate pelo nome.
windows-core = "0.62.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

