[package]
name = "shmupx-client"
version = "0.1.7"
description = "ShmupX Client"
authors = ["ShmupX"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "shmupx_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "sync", "macros", "io-util"] }
sysinfo = "0.33"
gilrs = "0.11"
cpal = "0.15"
hound = "3.5"
reqwest = { version = "0.12", features = ["json", "multipart"] }
rodio = "0.19"
ort = "2.0.0-rc.13"
image = "0.25"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
url = "2.5"
tauri-plugin-process = "2"
# SSH em Rust puro (criptografia ring): instala o ShmupX no MiSTer pela rede.
russh = { version = "=0.65.1", default-features = false, features = ["ring", "flate2", "rsa"] }

# Captura da janela do jogo para a live (Windows Graphics Capture).
[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
# Área interna da janela (sem a barra de título) e som só do processo do jogo.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_Security",
] }
# O `#[implement]` do `windows` gera código que usa este crate pelo nome.
windows-core = "0.62.2"

# A captura da live trata cada quadro na CPU: sem otimização, o `npm run dev` não chega a 60 fps.
[profile.dev.package.shmupx-client]
opt-level = 2

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

