[package]
name = "shmupx-mobile"
version = "0.1.0"
description = "ShmupX Lite (Android): salas, chat e lives pelo celular"
authors = ["ShmupX"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "shmupx_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "io-util", "net"] }
# rustls: no Android não há OpenSSL do sistema.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
url = "2.5"
